<section class="aesy-textarea-container" [class.aesy-textarea-error]="showError" [class.aesy-textarea-disabled]="isDisabled" [class.aesy-textarea-readonly]="readonly()">
  @if (label()) {
    <label class="aesy-textarea-label" [attr.for]="textareaId">
      {{ label() }}

      @if (isRequired) {
        <span class="aesy-form-control-required-asterisk" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="aesy-textarea-wrapper">
    <textarea
      class="aesy-textarea-textarea"
      [id]="textareaId"
      [name]="name()"
      [value]="currentValue"
      [placeholder]="placeholder()"
      [rows]="rows()"
      [attr.cols]="cols()"
      [attr.maxlength]="allowTypeInvalidValue() ? null : currentMaxLength"
      [required]="isRequired"
      [readonly]="readonly()"
      [disabled]="isDisabled"
      [style.resize]="resize()"
      [attr.aria-invalid]="isInvalid"
      [attr.aria-required]="isRequired"
      [attr.aria-describedby]="showError ? textareaId + '-error' : helpText() ? textareaId + '-help' : null"
      [class.aesy-form-control-text-align-left]="textAlign() === 'left'"
      [class.aesy-form-control-text-align-center]="textAlign() === 'center'"
      [class.aesy-form-control-text-align-right]="textAlign() === 'right'"
      (input)="onInput($event)"
      (blur)="onBlur()"></textarea>
  </div>

  @if (showError || helpText() || showCharCount()) {
    <div class="aesy-textarea-extra-data">
      @if (showError) {
        <span class="error-message" [id]="textareaId + '-error'" role="alert">
          {{ currentErrorMessage }}
        </span>
      } @else if (helpText()) {
        <span class="help-message" [id]="textareaId + '-help'">
          {{ helpText() }}
        </span>
      }

      @if (showCharCount()) {
        <span class="char-counter">
          {{ currentLength }}

          @if (currentMaxLength !== null) {
            / {{ currentMaxLength }}
          }
        </span>
      }
    </div>
  }
</section>
