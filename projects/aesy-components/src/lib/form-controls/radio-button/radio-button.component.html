<section class="aesy-radio-button-container" [class.aesy-radio-button-error]="showError" [class.aesy-radio-button-disabled]="isDisabled" [class.aesy-radio-button-readonly]="isReadonly">
  @if (label()) {
    <label class="aesy-radio-button-label" [id]="inputId + '-label'">
      {{ label() }}

      @if (isRequired) {
        <span class="aesy-form-control-required-asterisk" aria-hidden="true">*</span>
      }
    </label>
  }

  <div
    class="aesy-radio-button-wrapper"
    [class.aesy-radio-button-wrapper-horizontal]="orientation() === 'horizontal'"
    [class.aesy-radio-button-wrapper-vertical]="orientation() === 'vertical'"
    role="radiogroup"
    [attr.aria-labelledby]="label() ? inputId + '-label' : null"
    [attr.aria-invalid]="showError"
    [attr.aria-required]="isRequired"
    [attr.aria-describedby]="showError ? inputId + '-error' : helpText() ? inputId + '-help' : null">
    @for (option of options(); track $index) {
      <label class="aesy-radio-button-option-wrapper">
        <input class="aesy-radio-button-option-input" type="radio" [id]="inputId + '-' + $index" [name]="groupName" [checked]="isSelected(option.value)" [disabled]="isDisabled" [attr.aria-label]="option.label || null" (click)="selectOption(option, $event)" (blur)="onBlur()" />

        <span class="aesy-radio-button-option-control" aria-hidden="true"></span>
        @if (option.label) {
          <span class="aesy-radio-button-option-label">{{ option.label }}</span>
        }
      </label>
    }
  </div>

  @if (showError || helpText()) {
    <div class="aesy-radio-button-extra-data">
      @if (showError) {
        <span class="error-message" [id]="inputId + '-error'" role="alert">
          {{ errorMessage() }}
        </span>
      } @else if (helpText()) {
        <span class="help-message" [id]="inputId + '-help'">
          {{ helpText() }}
        </span>
      }
    </div>
  }
</section>
